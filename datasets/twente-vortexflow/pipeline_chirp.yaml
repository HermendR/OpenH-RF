parameters:
    xlims: [-0.08, 0.08]   # matches reconstruct.py
    zlims: [0.05, 0.10]
    grid_size_x: 1600
    grid_size_z: 700
pipeline:
    operations:
    -   name: keras.ops.cast
        params:
            dtype: float32
    - demodulate
    -   name: beamform
    - envelope_detect
    -   name: normalize
        params:
            output_range:
            - 0.0
            - 1.0
    - log_compress
