pipeline:
    name: pipeline
    operations:
    # Coherent overlap averaging can create fractional RF samples; no cast is needed.
    - apply_window
    - demodulate
    -   name: fir_filter
        params:
            axis: -3
            complex_channels: true
    -   name: beamform
        params:
            enable_pfield: false
            # Bound work units so the deep C5-2v grid fits on a 24 GB GPU.
    - envelope_detect
    # Use the true maximum; percentile normalization would clip strong reflectors.
    -   name: normalize
        params:
            output_range:
            - 0.0
            - 1.0
    - log_compress
parameters:
    sound_speed: 1540
    # Derive both grid dimensions at three samples per acoustic wavelength.
    pixels_per_wavelength: 3
