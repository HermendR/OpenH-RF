# Raw-data-to-scanline pipeline used by reconstruct.py. The documented
# display-only BK-like scan conversion and uncropped border are applied in
# reconstruct.py after this zea pipeline completes.
pipeline:
    name: module_c_native_scanline_delay_and_sum
    operations:
    -   name: keras.ops.cast
        params:
            dtype: float32
    - demodulate
    -   name: beamform
        params:
            beamformer: delay_and_sum
            enable_aligned_apodization: true
    - envelope_detect
    -   name: normalize
        params:
            output_range:
            - 0.0
            - 1.0
            percentile: 99.5
    - log_compress
parameters:
    enable_scanline: true
    grid_type: cartesian
    zlims:
    - 0.0001
    - 0.14
    grid_size_z: 704
    dynamic_range:
    - -50.0
    - 0.0
    f_number: 0.0
    apply_lens_correction: false
